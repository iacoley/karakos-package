name: CI

# push->main trigger removed 2026-09-17 (Mike, #bellboard 11:36 PT: a $5/mo
# Actions budget, "make sure we are not pushing and running CI constantly
# but only every day, across all repos" — same fix mcarmody/karakos got
# 2026-09-16 when its per-push volume drove the account-wide billing halt,
# config/ci-hold.json). Rolled up to one scheduled run/day; `pull_request`
# stays as-is (event-driven, the only pre-merge signal a PR gets, and not
# the volume driver here). `workflow_dispatch` added so a specific commit
# can still be checked on demand without waiting for the next scheduled run.
on:
  pull_request:
    branches: [main, develop, release/2.0]
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

jobs:
  # Fast checks — runs in seconds, catches syntax and structure issues
  lint-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest

      - name: Check Python syntax (all scripts)
        run: |
          find bin/ system/ mcp/ -name '*.py' -exec python -m py_compile {} +

      - name: Check shell syntax (all scripts)
        run: |
          find . -name '*.sh' -not -path './.git/*' -exec bash -n {} +

      - name: Validate file structure
        run: pytest tests/test_smoke_docker.py::TestFileStructure -v

      - name: Validate setup script
        run: pytest tests/test_setup.py -v

  # Unit tests — tests core logic without Docker
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v -m "not slow" --tb=short

  # The dashboard (dashboard/): unit tests and a production build, with the
  # lockfile as the only input. No secret, no network fetch beyond npm.
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Docker build smoke test — catches Dockerfile and build issues. The image
  # builds the dashboard from dashboard/ in this repo, so this job needs no
  # secret and runs for fork PRs too.
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t karakos-test:smoke .

      # The image's ENTRYPOINT (bin/entrypoint.sh) requires DASHBOARD_PORT and
      # AGENT_SERVER_TOKEN to be set — those are runtime concerns, not build-
      # artifact checks. Override --entrypoint so each smoke test runs against
      # the image without going through the production startup path.

      - name: Verify the dashboard was built into the image
        run: docker run --rm --entrypoint test karakos-test:smoke -f /workspace/dashboard/.next/BUILD_ID

      # Proves the native modules load in the RUNTIME image: this is the check
      # that catches a Node ABI or libc mismatch with the build stage.
      - name: Verify dashboard native modules load
        run: >
          docker run --rm --entrypoint node karakos-test:smoke -e
          "require('/workspace/dashboard/node_modules/better-sqlite3');
          require('/workspace/dashboard/node_modules/sqlite3');
          console.log('native ok')"

      # Login is served, a route the dashboard does not have is 404 (checked
      # with a session: without one every page answers 307 to /login), and the
      # API is closed to an unauthenticated caller.
      - name: Verify dashboard serves the login page and keeps its API closed
        run: |
          docker run -d --name dash --entrypoint bash -p 3000:3000 \
            -e DASHBOARD_PASSWORD=ci-only -e SESSION_SECRET=ci-only-ci-only-ci-only-ci-only \
            -e DASHBOARD_PORT=3000 karakos-test:smoke \
            -c 'cd /workspace/dashboard && exec npx next start -p 3000'
          for i in $(seq 1 40); do
            curl -s -o /dev/null http://localhost:3000/login && break || sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/agents)" = 401
          curl -s -o /dev/null -c jar -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-only"}' http://localhost:3000/api/auth
          test "$(curl -s -o /dev/null -w '%{http_code}' -b jar http://localhost:3000/system)" = 404
          docker rm -f dash

      - name: Verify Python dependencies
        run: docker run --rm --entrypoint python3 karakos-test:smoke -c "import aiohttp, aiosqlite, discord; print('ok')"

      - name: Verify Node.js installed
        run: docker run --rm --entrypoint node karakos-test:smoke --version

  # Daily real-CLI canary (7.3a). The fake `claude` replays what step 0.4 recorded
  # from a real CLI; the CLI auto-upgrades inside the image, so recorded behaviour
  # can drift silently. This runs on the existing daily schedule (no new trigger).
  # CLAUDE_CODE_OAUTH_TOKEN is a repository secret for a scratch account. With it
  # missing, the scheduled run skips with a warning (a daily red X for an absent
  # secret is noise); a manual dispatch fails. The release gate skips it without the secret.
  real-cli-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Credential present?
        id: cred
        run: |
          if [ "$HAS_CLAUDE_TOKEN" = true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = schedule ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not set: skipping the daily real-CLI canary"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set: the real-CLI canary cannot run"
            exit 1
          fi

      - uses: actions/setup-python@v5
        if: steps.cred.outputs.run == 'true'
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        if: steps.cred.outputs.run == 'true'
        with:
          node-version: 22

      - name: Install the CLI (as the image does) and test dependencies
        if: steps.cred.outputs.run == 'true'
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
          pip install pytest -r requirements.txt

      - name: Real-CLI smoke
        if: steps.cred.outputs.run == 'true'
        env:
          KARAKOS_REQUIRE_REAL_CLI: "1"
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 -m pytest tests -q -m "slow and realcli"

  # Preflight script — tests bin/preflight.sh check logic via Python test suite
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest

      - name: Verify preflight.sh syntax
        run: bash -n bin/preflight.sh

      - name: Run preflight test suite
        run: pytest tests/test_preflight.py -v -m "not slow" --tb=short

  # Household denylist (rules live outside the repo; see README "Public-safety
  # check") plus a secret scan of the working tree.
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Household denylist
        env:
          PII_RULES_JSON: ${{ secrets.PII_RULES_JSON }}
        run: |
          if [ -z "$PII_RULES_JSON" ]; then echo "::notice::PII_RULES_JSON secret not set; denylist skipped"; exit 0; fi
          printf '%s' "$PII_RULES_JSON" > "$RUNNER_TEMP/pii_rules.json"
          python3 bin/verify-public-safety.py --all --require-rules --rules "$RUNNER_TEMP/pii_rules.json"
      - name: gitleaks (working tree)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo --no-git --redact --config /repo/.gitleaks.toml

  # Docker Compose validation
  compose-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The production config/.env is generated by the setup wizard and never
      # committed. For CI validation we only need the file to exist with the
      # required keys present — the values don't matter for `compose config`.
      - name: Create dummy env for validation
        run: |
          cat > config/.env <<'EOF'
          DASHBOARD_PORT=3000
          AGENT_SERVER_PORT=18791
          AGENT_SERVER_TOKEN=ci-validation-only
          TZ=UTC
          EOF

      - name: Validate docker-compose.yml
        run: docker compose -f config/docker-compose.yml config --quiet

      - name: Validate docker-compose.dev.yml overlay
        run: docker compose -f config/docker-compose.yml -f config/docker-compose.dev.yml config --quiet
